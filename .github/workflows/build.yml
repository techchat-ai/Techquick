name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIPFILE=$(ls *.zip | head -n 1)
          echo "Extracting $ZIPFILE"
          unzip -o "$ZIPFILE" -d extracted
          PROJECT_DIR=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
          mkdir -p project
          cp -r "$PROJECT_DIR"/. project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate real Gradle wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        working-directory: project
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechQuickAI-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
